[package]
name = "fefat-py"
description = "PyO3 bindings: the Python module fefat_engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# Tested from Python through the built module: a cargo test binary would have to load libpython.
test = false

[lints]
workspace = true

[dependencies]
arrow-array = "59"
fefat-core = { path = "../fefat-core" }
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
# Without the default buffer_protocol: only Arrow arrays and streams, never raw buffers of any byte order.
pyo3-arrow = { version = "0.19.0", default-features = false }
