[package]
name = "fefat-cli"
description = "Command-line driver: spec in, artifacts out; golden tests and benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = "59.3.1"
arrow-ipc = "59.3.1"
arrow-schema = "59.3.1"
blake3.workspace = true
fefat-core = { path = "../fefat-core" }
fefat-data = { path = "../fefat-data" }
fefat-engine = { path = "../fefat-engine" }
fefat-run = { path = "../fefat-run" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The benchmarks of step 2.15 (D-68): criterion without its plots, and Rayon for the batch,
# which runs its cases on Rayon's threads as `fefat_engine.run_batch` does.
[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "rayon"] }
rayon = "1.12.0"

[[bench]]
name = "engine"
harness = false
