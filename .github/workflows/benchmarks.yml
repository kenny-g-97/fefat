# The engine's benchmarks on the generated year of step 2.7 (`just bench`,
# step 2.15, D-68), each median against the runner's baseline in
# docs/validation/benchmarks-ci-baseline.json. A benchmark over 30 % slower
# warns in the job's summary, and the job still passes: shared runners are
# too noisy for a gate, and the numbers on the reference PC
# (docs/validation/benchmarks.md) decide. The benchmark step may even fail or
# reach its time limit without failing the job, so that this check never
# blocks a merge; its log and summary say what happened. It runs only for a
# change that can move the engine's speed, since the private repository's
# free plan counts its minutes (docs/masterplan/07-tools-and-costs.md).
# Actions are pinned to commits (D-33); the comment names the release.
name: Benchmarks

on:
  pull_request:
    paths:
      - "engine/**"
      - "python/fefat/src/fefat/market/**"
      - "scripts/bench.py"
      - "scripts/gen_fixtures.py"
      - "docs/validation/benchmarks-ci-baseline.json"
      - ".github/workflows/benchmarks.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "python/fefat/src/fefat/market/**"
      - "scripts/bench.py"
      - "scripts/gen_fixtures.py"
      - "docs/validation/benchmarks-ci-baseline.json"
      - ".github/workflows/benchmarks.yml"

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless; every merge
# to main keeps its own run.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    # A cold build of the engine, the year's generation, and the benchmarks;
    # the benchmark step has a limit of its own, so that the Rust cache is
    # saved even when it is reached.
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.33"
          activate-environment: true

      - name: Install the Rust toolchain pinned in engine/rust-toolchain.toml
        working-directory: engine
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      - run: uv sync --locked --all-packages
      - run: just build-engine

      # criterion keeps its results in the runner's temporary folder: the Rust
      # cache restores engine/target/criterion only in part, and criterion
      # then fails to read its last run's samples.
      - name: Benchmark the engine against the runner baseline
        run: just bench --baseline docs/validation/benchmarks-ci-baseline.json
        env:
          CRITERION_HOME: ${{ runner.temp }}/criterion
        continue-on-error: true
        timeout-minutes: 30
