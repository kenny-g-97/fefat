# Checks every pull request and every push to main on Windows and Linux with
# the same just recipes as on the PC, then builds and imports the fefat_engine
# wheel. One job per system, so `gh pr checks` lists one check each: the merge
# routine in docs/masterplan/05-build-process.md section 8 waits for them.
# Actions are pinned to commits (D-33); the comment names the release.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    # Guards against a hung run; with warm caches a run takes well under 15 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            runner: windows-latest
          - system: Ubuntu
            runner: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The active .venv is where PyO3's build script finds Python 3.12 on Linux.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          activate-environment: true

      - name: Install the Rust toolchain pinned in engine/rust-toolchain.toml
        working-directory: engine
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      - run: just setup
      - run: just check
      - run: just test

      # Into dist/, outside the cached target folder, so no older wheel comes along.
      - name: Build the fefat_engine wheel
        working-directory: engine
        run: uv run maturin build --release --manifest-path crates/fefat-py/Cargo.toml --out ../dist

      - name: Install the wheel into a fresh venv and import it
        run: |
          uv venv "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check" dist/*.whl
          uv run --no-project --python "$RUNNER_TEMP/wheel-check" python -c "import fefat_engine"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fefat_engine-${{ matrix.system }}
          path: dist/*.whl
          if-no-files-found: error
          # Artifacts count against the free plan's storage.
          retention-days: 14
