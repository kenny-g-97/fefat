# Checks every pull request and every push to main on Windows and Linux with
# the same just recipes as on the PC (`just setup` builds the engine, so the
# checks and tests run on the real extension), then builds and imports the
# fefat_engine wheel. One job per system, so `gh pr checks` lists one check
# each: the merge routine in docs/masterplan/05-build-process.md section 8
# waits for them. Beside them, the advisory Benchmarks job (step 2.15).
# Actions are pinned to commits (D-33); the comment names the release.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless; every merge
# to main keeps its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    # Guards against a hung run. With warm caches a Windows run took from 12 to
    # over 20 minutes in October 2026, its runners varying twofold in speed.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            runner: windows-latest
          - system: Ubuntu
            runner: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # The whole history, so that the data guard below can check each commit
      # since main, not only the final tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The active .venv is where PyO3's build script finds Python 3.12 on Linux.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.33"
          activate-environment: true

      - name: Install the Rust toolchain pinned in engine/rust-toolchain.toml
        working-directory: engine
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      - run: just setup
      - run: just check

      # `just check` guards the final tree; a data file that one commit of a
      # pull request adds and a later one removes is still in its history,
      # which GitHub keeps (D-48). Nothing to check on a push to main.
      - name: Run the data guard over each commit since main
        run: uv run --no-project python scripts/guard_data.py --commits origin/main..HEAD

      # A skipped test, or one expected to fail, passes in silence (D-51); the
      # tests a pull request deletes stay the step-reviewer's check.
      - name: Refuse skip markers added since main
        run: uv run --no-project python scripts/guard_skip_markers.py origin/main...HEAD

      - run: just test

      # A release build, like `just build-engine`, so it reuses the compiled
      # crates; publishing wheels waits for a release workflow. Into dist/,
      # outside the cached target folder.
      - name: Build the fefat_engine wheel
        working-directory: engine
        run: uv run maturin build --release --manifest-path crates/fefat-py/Cargo.toml --out ../dist

      - name: Install the wheel into a fresh venv and import it
        run: |
          uv venv "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check" dist/*.whl
          uv run --no-project --python "$RUNNER_TEMP/wheel-check" python -c "import fefat_engine"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fefat_engine-${{ matrix.system }}
          path: dist/*.whl
          if-no-files-found: error
          # Artifacts count against the free plan's storage.
          retention-days: 14

  # The engine's benchmarks on the generated year of step 2.7 (`just bench`,
  # step 2.15, D-68), each median against the runner's baseline. A benchmark
  # over 30 % slower warns in the job's summary and the job still passes:
  # shared runners are too noisy for a gate, and the numbers on the reference
  # PC (docs/validation/benchmarks.md) decide. continue-on-error keeps even a
  # broken benchmark from failing the workflow. The year is generated on each
  # run, about 1.4 GB under the runner's home.
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.33"
          activate-environment: true

      - name: Install the Rust toolchain pinned in engine/rust-toolchain.toml
        working-directory: engine
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      - run: uv sync --locked --all-packages
      - run: just build-engine
      - run: just bench --baseline docs/validation/benchmarks-ci-baseline.json
