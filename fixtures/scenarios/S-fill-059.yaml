# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01; latency 100 ms):
# decided at 14:30:00 and active at 14:30:00.100, the buy sees the bar from 14:30 to 14:31
# (F-ACT-02) and fills at its open plus a tick, 5000.00 + 0.25 = 5000.25, at its close (F-MKT-03,
# F-BAR-06), on ESH2026; its bracket, stop 4990.00 and target 5030.00 (F-OCO-02), is reached by no
# point of the bar's path;
# at the roll, 22:00:00 on 03-08, the stop moves by the gap of 20.00 to 5010.00 and the target to
# 5050.00 (F-ROL-03), and the long's legs are sent, orders 4 and 5 (F-ROL-02);
# the new front's first bar, 22:00 to 22:01, fills them at its open before it is replayed, both at
# its close, 22:01: the close leg at 5026.00 - 20.00 - 0.25 = 5005.75, the open leg at
# 5026.00 + 0.25 = 5026.25 (F-ROL-02, F-SLP-01); the bar's path, 5026.00, 5025.00, 5027.00,
# 5026.50, reaches neither the stop nor the target;
# the bar of 14:00 on 03-09 opens at 5012.00 above the stop and, the long held, goes to its low
# first (F-BAR-02): the path from 5012.00 to 5009.00 reaches the stop at 5010.00 (F-STP-01):
# fill = 5010.00 - 0.25 = 5009.75 (F-STP-04), at 14:01, on ESM2026; with the extremes swapped the
# stop still fills there, so the bar is not ambiguous. Without the roll the stop at 4990.00 would
# still work.
