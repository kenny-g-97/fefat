# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01):
# at 14:30 long_entry places a buy limit at the row's entry_price, 4999.00, order 1 (F-ENT-02);
# the trade at 14:30:00.200, 5000.00, does not reach it;
# the 14:35 decision's row gives an atr of 0.50 point, but no position is open: a plan's distance
# comes from its entry row and is taken again only at decisions after its fill (F-TRL-02);
# 14:36, 4998.75: the trade goes through the limit, which fills at 4999.00 (F-LMT-03); its stop,
# order 2, 20 ticks below at 4994.00, rises at once to the market at the fill less the entry row's
# distance, 1.0 × 2.00 points = 8 ticks: 4998.75 - 2.00 = 4996.75 (F-PLN-04, F-TRL-01); its
# target, order 3, at 5009.00;
# 14:37, 4998.25: above the stop, and no new best price; with the 14:35 row's distance of 2 ticks
# the stop would have stood at 4998.75 - 0.50 = 4998.25 and sold here;
# at the 14:40 decision the row's atr is 0.50: the distance becomes 2 ticks, and the trailing
# level 4998.75 - 0.50 = 4998.25 lies at the mark 4998.25, so the stop rises to a tick below it,
# 4998.00 (F-TRL-02, F-PLN-03);
# 14:41, 4998.00: the trade is at the stop and triggers it (F-STP-01): it sells at the lower of
# 4998.00 - 0.25 = 4997.75 and 4998.00, 4997.75 (F-STP-03), and the target is cancelled
# (F-OCO-01).
