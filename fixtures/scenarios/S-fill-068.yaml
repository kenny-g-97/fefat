# Arithmetic (ES, tick 0.25; TBBO fills at the quote, with no slippage ticks: F-SLP-01; the
# session of 2026-03-06 closes at 22:00Z, and that of 2026-03-09 opens at 2026-03-08T22:00Z):
# decided at 20:00:00.000 and active at 20:00:00.100 (F-ACT-01), the buy fills at the ask of the
# record at 20:00:00.200, 5001.25 (F-MKT-01), on ESH2026; its bracket, stop 4995.00 and target
# 5100.00, is placed (F-OCO-02);
# the trade at 4994.75 at 21:59:59 reaches the stop at 4995.00 (F-STP-01): on TBBO the stop is
# then a market order already sent, which fills at the next tradeable record's quote (F-STP-02),
# but the session closes at 22:00 and the next record comes after the weekend;
# at the roll, 22:00:00 on 03-08 (F-ROL-01), the triggered stop is on its way out of all the
# long's lots, so it does the close leg's work and no close leg is sent; with flatten the roll
# cancels the rest of the position's exit plan, the target (F-ROL-04); the stop moves by the gap
# to 5015.00 (F-ROL-03);
# the new front's first record, at 22:00:00.500, fills the stop first, at the price F-STP-02 gives
# it there, less the gap: the bid, 5024.75, no better than the trade, 5025.00, but never above the
# moved stop less its ticks, 5015.00 - 0 = 5015.00, so 5015.00, less the gap: 5015.00 - 20.00 =
# 4995.00, its own stop, never better (F-STP-02, F-ROL-02), on ESH2026, with its own role, stop;
# the long is flat.
