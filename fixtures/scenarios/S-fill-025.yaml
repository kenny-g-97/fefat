# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01). A buy stop at 5005.00 and a
# sell stop at 4995.00 form one OCO group:
# at 14:30:02.100 a trade at 5005.00 triggers the buy stop (F-STP-01);
# fill = higher of (5005.00 + 1 × 0.25, 5005.00) = 5005.25 (F-STP-03);
# the sell stop is cancelled at once (F-OCO-01), so the trade at 4994.50 later fills nothing.
