# schedules, 2.00 per contract per side from 2026-03-06 and 2.50 from 2026-03-07):
# the buy of 2 lots fills at 5000.00 + 0.25 = 5000.25 (F-MKT-02) on trade date 2026-03-05, whose
# session runs from 23:00 on 03-04 to 22:00 on 03-05: a date before the table's first schedule,
# which prices it with a warning in the run (F-FEE-01): fee = 2 x 2.00 = 4.00;
# the sell of 2 lots fills at 5010.00 - 0.25 = 5009.75 on trade date 2026-03-09, whose session
# opened at 22:00 on 03-08: the schedule from 03-07 is in force: fee = 2 x 2.50 = 5.00
