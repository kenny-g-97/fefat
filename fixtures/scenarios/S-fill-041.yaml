id: S-fill-041
title: On TBBO a bracket stop at its entry record's trade price is through the market and fills on the next record
fidelity: tbbo
instrument: ES
orders:
  - {id: 1, placed_at: "2026-03-06T14:30:00.000Z", side: buy, kind: market, quantity: 1, bracket: {stop: {id: 2, price: "4999.75"}, target: {id: 3, price: "5010.00"}}}
tape:
  - {ts: "2026-03-06T14:30:00.200Z", price: "4999.75", size: 2, bid: "4999.75", ask: "5000.00", bid_size: 6, ask_size: 5}
  - {ts: "2026-03-06T14:30:00.450Z", price: "5000.00", size: 1, bid: "4999.75", ask: "5000.00", bid_size: 4, ask_size: 3}
expected:
  fills:
    - {order: 1, ts: "2026-03-06T14:30:00.200Z", price: "5000.00", rule: F-MKT-01}
    - {order: 2, ts: "2026-03-06T14:30:00.450Z", price: "4999.75", rule: F-STP-05}
rules: [F-MKT-01, F-OCO-01, F-OCO-02, F-SLP-01, F-STP-05]

# Arithmetic (ES, tick 0.25; TBBO fills at the quote, with no slippage ticks: F-SLP-01):
# the buy market order fills at the ask of the first record after its activation:
# 5000.00 + 0 × 0.25 = 5000.00 (F-MKT-01), at 14:30:00.200;
# its bracket is placed then and works from the next record on (F-OCO-02); the market at the entry's
# fill, before slippage, is that record's trade price, 4999.75, a seller's trade at the bid, so the
# sell stop at 4999.75 is at the market, already through, and fills at once as a market order
# (F-STP-05): at the bid of the next record = 4999.75 - 0 × 0.25 = 4999.75, at 14:30:00.450; the
# target is cancelled (F-OCO-01);
# judged against the ask or the fill price, 5000.00, the stop would have waited, and no trade of
# this tape reaches 4999.75 after the entry.
