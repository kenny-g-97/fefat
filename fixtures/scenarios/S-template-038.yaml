# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01; latency 100 ms):
# the session of Friday 2026-11-27, the day after Thanksgiving, closes early at 12:15 CST, 18:15
# UTC; flat-by 15:05 CST, 21:05 UTC, comes after the close, so the template acts at the last signal
# close before the close, 18:10 (F-TIM-01);
# at 17:55 long_entry buys, order 1, which fills on the trade at 17:55:00.200:
# 5000.00 + 0.25 = 5000.25, its stop and target orders 2 and 3, which no trade reaches;
# at 18:05 nothing happens; at 18:10 the template sells at the market, order 4, exit reason
# flat_by, cancelling orders 2 and 3; it fills on the trade at 18:10:00.300: 5002.00 - 0.25 =
# 5001.75;
# at 18:15, the close, long_entry places nothing: the trade date is past its flat-by time; had it
# bought, the order would have filled on the next session's trade at 23:00:00.500 on 11-29.
