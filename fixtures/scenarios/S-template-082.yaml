# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01; latency 100 ms), as in
# S-template-036 but for its span (the Phase 2 exit's engine-accuracy review):
# at the 14:30 close long_entry is true: the template buys 1 lot at the market, order 1, which
# fills on the trade at 14:30:00.200: 5000.00 + 0.25 = 5000.25 (F-MKT-02), and places its stop,
# order 2, at 4990.25 and its target, order 3, at 5010.25, which no trade reaches;
# 200,000,000 minutes after the fill is about 380 years later, past 2262, the last instant a run's
# nanoseconds since 1970 hold in 64 bits, so no decision comes at or after it and the position
# stays open (F-TIM-02); a span that overflows is never reached, as a span past the tape is.
