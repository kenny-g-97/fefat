# Arithmetic (ES, tick 0.25; a quote is read no better than its record's trade: F-SLP-01). A sell
# limit at 5005.00 is active at 14:30:00.100 (F-ACT-01):
# the record at 14:30:00.200 trades 5000.00 under a bid of 4999.75: the limit rests (F-LMT-04);
# the record at 14:30:00.300 is contrived as a later print of a seller's sweep: its trade at 5004.75
# lies below the bid of 5005.25 it carries from before the sweep, so the bid counts as that trade,
# 5004.75 (F-SLP-01), which neither trades above the limit nor bids at it (F-LMT-01);
# the record at 14:30:00.400 trades 5005.25, above the limit, through it (F-LMT-01):
# fill = 5005.00 (F-LMT-03);
# read as recorded, the bid of 5005.25 would fill it a record earlier, at 5005.00, above the only
# trade of that record.
