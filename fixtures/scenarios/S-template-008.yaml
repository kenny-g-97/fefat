# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01):
# at the 14:30 close long_entry is true: the template buys 2 lots at the market, order 1, active at
# 14:30:00.100, and it fills at the open of the bar from 14:30 to 14:31 plus a tick,
# 5000.00 + 0.25 = 5000.25 (F-ACT-02, F-MKT-03), at 14:31;
# its exit plan is placed then (F-OCO-02, F-PLN-01): the stop, order 2, for the 2 lots,
# 5000.25 - 8 × 0.25 = 4998.25; target 1, order 3, 5000.25 + 4 × 0.25 = 5001.25 for
# 0.5 × 2 = 1 lot; target 2, order 4, 5000.25 + 12 × 0.25 = 5003.25 for 1 × (2 - 1) = 1 lot;
# the rest of the entry's bar comes adverse first (F-BAR-04): 4999.75 stays over the stop, and
# 5000.50 stays under target 1;
# the bar from 14:31 to 14:32 replays for the long as 5001.00, 5000.75, 5001.75, 5001.50 (F-BAR-02):
# the rise to 5001.75 goes through target 1, which fills 1 lot at its price, 5001.25
# (F-LMT-01, F-LMT-03); 1 lot stays open, so the stop is reduced to 1 lot (F-PLN-02);
# the bar from 14:32 to 14:33 replays as 5002.00, 5001.75, 5003.50, 5003.00: the rise to 5003.50
# goes through target 2, which fills the last lot at 5003.25; no lots stay open, so the stop is
# cancelled (F-PLN-02, F-OCO-01): the trade made (5001.25 - 5000.25) + (5003.25 - 5000.25) = 4.00 points.
