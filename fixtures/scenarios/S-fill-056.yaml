id: S-fill-056
title: With a 1-minute bar's extremes swapped, its entry is still followed by the move against it, so the bar is not ambiguous
fidelity: 1m
instrument: ES
orders:
  - {id: 1, placed_at: "2026-03-06T14:30:00.000Z", side: buy, kind: limit, price: "4998.00", quantity: 1, bracket: {stop: {id: 2, price: "4995.00"}, target: {id: 3, price: "5004.00"}}}
tape:
  - {ts_open: "2026-03-06T14:30:00Z", ts_close: "2026-03-06T14:31:00Z", open: "5000.00", high: "5005.00", low: "4994.00", close: "5000.00", volume: 650}
expected:
  fills:
    - {order: 1, ts: "2026-03-06T14:31:00Z", price: "4998.00", rule: F-LMT-03}
