# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01; latency 100 ms):
# at the 14:30 close long_entry is true: the template buys 1 lot at the market, order 1, which
# fills on the trade at 14:30:00.200: 5000.00 + 0.25 = 5000.25 (F-MKT-02), and places its stop,
# order 2, at 4990.25 and its target, order 3, at 5010.25, which no trade reaches;
# two minutes after the fill is 14:32:00.200: the decision at 14:32 comes before it, so the
# position stays; the first decision at or after it is 14:33, where the template sells at the
# market, order 4, exit reason max_minutes (F-TIM-02); order 4 is active at 14:33:00.100 and fills
# on the trade at 14:33:00.300: 4999.50 - 0.25 = 4999.25.
