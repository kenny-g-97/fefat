# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01):
# order 1 buys 1 lot at the open of the bar from 14:30 to 14:31 plus a tick, 5000.00 + 0.25 =
# 5000.25 (F-MKT-03); its stop 12 ticks below the fill, 4997.25, rises at once to the market at the
# fill, the open, less 4 ticks: 4999.00 (F-PLN-04, F-TRL-01): order 2; the target, order 3, at
# 5010.25;
# the rest of the entry's bar comes adverse first (F-BAR-04): its low 4999.75 is no new best price;
# its high 5000.50 is, and the stop rises to 4999.50 (F-TRL-04); its close 5000.25 stays above it;
# the bar from 14:31 to 14:32 replays for the long as 5000.50, 4999.25, 5002.00, 5001.50 (F-BAR-02):
# the fall to 4999.25 reaches the stop at 4999.50 (F-STP-01), which sells at 4999.50 - 0.25 =
# 4999.25 (F-STP-04), and the target is cancelled (F-OCO-01);
# with its extremes swapped (F-BAR-05) the high comes first: at 5002.00 the stop rises to 5001.00
# (F-PLN-03), and the fall from there passes it (F-BAR-01): it sells at 5001.00 - 0.25 = 5000.75;
# another price, so the bar's fill is flagged ambiguous.
