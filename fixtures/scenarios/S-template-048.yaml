# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01):
# the trade at 14:29:59.000 marks the market at 5000.00 (F-MRK-01); at the 14:30 close long_entry
# places a buy limit 4 ticks under that mark, 5000.00 - 4 × 0.25 = 4999.00, order 1 (F-ENT-02);
# the trade at 14:30:00.200, 4999.50, stays above it; the one at 14:30:30.000, 4998.75, goes
# through it: it fills at 4999.00 (F-LMT-03), its stop, order 2, at 4999.00 - 8 × 0.25 = 4997.00
# and its target, order 3, at 5001.00;
