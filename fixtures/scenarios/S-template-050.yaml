# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01):
# the trade at 14:29:59.000 marks the market at 5000.00 (F-MRK-01); at the 14:30 close long_entry
# places a buy stop 4 ticks above that mark, 5000.00 + 4 × 0.25 = 5001.00, order 1 (F-ENT-02);
# the trade at 14:30:00.200, 5000.50, stays under it; the one at 14:30:30.000, 5001.25, reaches it
# (F-STP-01): it fills at the higher of 5001.00 + 0.25 and 5001.25, 5001.25 (F-STP-03);
# its stop, order 2, lies at 5001.25 - 8 × 0.25 = 4999.25 and its target, order 3, at 5003.25;
# the trade at 14:31:00.000, 5003.50, goes through the target, which fills at 5003.25.
