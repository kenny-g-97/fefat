# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01):
# order 1 buys 1 lot on the trade at 14:30:00.200, at 5000.00 + 0.25 = 5000.25 (F-MKT-02); its stop
# 12 ticks below the fill, 4997.25, rises at once to 5000.00 - 1.00 = 4999.00 (F-PLN-04, F-TRL-01):
# order 2; the target, order 3, at 5010.25;
# 14:31:10, 5001.00: the stop rises to 5000.00 (F-TRL-04);
# 14:31:20, 5002.00: to 5001.00;
# 14:31:30, 5001.50: above it;
# 14:32:10, 5001.00: at the stop, which sells at the lower of 5000.75 and 5001.00, 5000.75
# (F-STP-03), and the target is cancelled (F-OCO-01).
# A replay that skips by the 1-minute bar from 14:31 to 14:32, which trades from 5001.00 to 5002.00,
# finds the stop at 4999.00 below it and the target above it, but the bar rises above the plan's
# best price, 5000.00, so it must descend to the trades (F-PLN-05); skipped, the stop would stay at
# 4999.00, and the trade at 14:32:10 would not reach it.
