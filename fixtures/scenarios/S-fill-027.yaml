# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01). The session of 2026-03-05
# closes at 16:00 Chicago, 22:00 UTC, and that of 2026-03-06 opens at 17:00 Chicago, 23:00 UTC:
# decided at the close, 22:00:00.000, the order is active at 22:00:00.100, in the break (F-ACT-01);
# the print received at 22:00:00.400 falls in the break and is not tradeable (F-SES-02);
# the next session's first trade prints 5009.50 at 23:00:00.050;
# fill = 5009.50 + 1 × 0.25 = 5009.75 (F-MKT-02).
