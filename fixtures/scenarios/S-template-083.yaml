# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01; latency 100 ms), as in
# S-template-062 but for its span (the Phase 2 exit's engine-accuracy review):
# the long of 14:30, order 1 at 5000.00 + 0.25 = 5000.25, closes at a loss when its stop,
# order 2 at 5000.25 - 4 × 0.25 = 4999.25, fills at 4999.25 - 0.25 = 4999.00 at 14:30:30.000
# (F-STP-03);
# 200,000,000 minutes after 14:30:30 is about 380 years later, past 2262, the last instant a
# run's nanoseconds since 1970 hold in 64 bits, so the cooldown skips the entries of every later
# decision (F-LIM-03): 14:31 to 14:34 place nothing; a span that overflows is never over.
