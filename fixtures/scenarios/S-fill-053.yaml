# Arithmetic (ES, tick 0.25). A buy limit at 4995.00 (order 1) and a sell limit at 5005.00
# (order 2), placed at one instant as one OCO group, fade either edge of a range:
# the bar from 14:30 to 14:31 opens at 5000.00, between them, and reaches both, high 5006.00 and
# low 4994.00;
# flat after the open, the first extreme is the favourable one of the earliest placed entry, the
# lower order id at one instant (F-BAR-03): order 1 buys, so the high comes first, whatever the
# entry's kind; on the way up the path goes through 5005.00 (F-LMT-01):
# fill of order 2 = 5005.00 (F-LMT-03), and order 1 is cancelled (F-OCO-01);
# had the buy limit's own fill, on the way down, chosen the first extreme, the low would have come
# first and order 1 would have filled at 4995.00;
# with the low first, as the swapped replay has it, order 1 fills at 4995.00 instead: another fill,
# so the bar is ambiguous and its fill flagged (F-BAR-05).
