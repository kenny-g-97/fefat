# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01; a step is 2 × 0.25 = 0.50):
# order 1 buys 1 lot on the trade at 14:30:00.200, at 5000.00 + 0.25 = 5000.25 (F-MKT-02); the stop
# 8 ticks below the fill, 4998.25; the trailing stop, working from the fill, wants 5000.00 - 1.00 =
# 4999.00, 0.75 above it, room for one whole step: order 2 at 4998.25 + 0.50 = 4998.75 (F-PLN-04,
# F-TRL-01, F-TRL-03); the target, order 3, at 5010.25;
# each new best price gives a trailing level 4 ticks below it, and the stop moves up by the whole
# steps that fit between where it stands and that level (F-TRL-03):
# 14:30:01, 5000.50: level 4999.50, 0.75 above 4998.75, one step: 4999.25;
# 14:30:02, 5001.00: level 5000.00, 0.75 above 4999.25, one step: 4999.75;
# 14:30:03, 5001.25: level 5000.25, 0.50 above 4999.75, one step: 5000.25;
# 14:30:04, 5001.50: level 5000.50, 0.25 above 5000.25, no step: the stop stays at 5000.25;
# 14:30:05, 5000.50: above the stop; a stop trailing every tick would stand at 5000.50 and sell here;
# 14:30:06, 5000.25: at the stop, which sells at the lower of 5000.00 and 5000.25, 5000.00 (F-STP-03),
# and the target is cancelled (F-OCO-01).
