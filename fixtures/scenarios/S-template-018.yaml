# the bar from 14:32 to 14:33 replays as 5000.75, 5000.00, 5001.00, 5000.50: the fall to 5000.00
# reaches the stop at 5000.25 (F-STP-01), which sells the last lot at 5000.25 - 0.25 = 5000.00
