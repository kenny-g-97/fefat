# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01; latency 100 ms):
# at the 14:30 close long_entry is true: the template buys 1 lot at the market, order 1, active at
# 14:30:00.100, which fills on the trade at 14:30:00.200: 5000.00 + 0.25 = 5000.25 (F-MKT-02);
# its exit plan is placed then (F-OCO-02, F-PLN-01): the stop, order 2, at
# 5000.25 - 40 × 0.25 = 4990.25 and the target, order 3, at 5000.25 + 40 × 0.25 = 5010.25, which no
# trade reaches;
# the decisions at or after the fill are 14:31, the first, and 14:32, the second: at 14:32 the
# position has stayed max_bars = 2 decisions, so the template sells it at the market, order 4,
# exit reason max_bars (F-TIM-02), cancelling orders 2 and 3; order 4 is active at 14:32:00.100
# and fills on the trade at 14:32:00.400: 5001.00 - 0.25 = 5000.75;
# at 14:33 the template is flat with nothing working, so long_entry buys again, order 5, which
# fills on the trade at 14:33:00.300: 5001.50 + 0.25 = 5001.75 (F-ENT-01).
