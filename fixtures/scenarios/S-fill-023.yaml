# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01). A short of 2 has its stop at
# 5004.00 and its target at 4996.00, one OCO group:
# the bar from 14:30:01 to 14:30:02 reaches both, high 5004.50 and low 4995.50; holding the short,
# the path goes to the high first (F-BAR-02), passing 5004.00 and triggering the stop (F-STP-01);
# fill = 5004.00 + 1 × 0.25 = 5004.25 for both contracts (F-STP-04); the target is cancelled (F-OCO-01);
# with the low first the target would have filled at 4996.00 instead, so the fill is flagged
# ambiguous (F-BAR-05).
