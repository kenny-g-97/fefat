# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01). Flat, with four orders
# placed at 14:30:00.000: a sell stop at 4995.00 (order 1), a buy limit at 4995.00 (order 2), and
# a breakout pair of one OCO group, a buy stop at 5005.00 (order 3) and a sell stop at 4990.00
# (order 4). The bar from 14:30 to 14:31 opens at 5000.00, between every order's price.
# Flat, the earliest working entry, order 1, is a sell, so the low comes first (F-BAR-03):
# 5000.00, then down to 4989.00 (F-BAR-01).
# At 4995.00 the path reaches orders 1 and 2 at one point; the stop fills first, then the limit
# (F-OCO-01's order at one point): fill of order 1 = 4995.00 - 1 × 0.25 = 4994.75 (F-STP-01,
# F-STP-04), opening a short, then fill of order 2 = 4995.00 (F-LMT-01, F-LMT-03), closing it.
# The point leaves the position flat, so the path keeps its order (F-BAR-04, judged on the
# position after all the fills at a point) and goes on down: at 4990.00 order 4 fills at
# 4990.00 - 0.25 = 4989.75 (F-STP-04), opening a short, and order 3 is cancelled (F-OCO-01); the
# short turns the path adverse first (F-BAR-04): up to 5006.00, down to 4989.00, and back to the
# close, 5000.00, with nothing working. The run ends short 1.
# Had the short that order 1 opened turned the path at 4995.00, the high would have come next:
# order 3 would have filled at 5005.00 + 0.25 = 5005.25 and cancelled order 4, ending long 1.
# With the high first, order 3 fills at 5005.25 and cancels order 4, and on the way down orders 1
# and 2 fill at 4994.75 and 4995.00: other fills, so every fill is flagged ambiguous (F-BAR-05).
