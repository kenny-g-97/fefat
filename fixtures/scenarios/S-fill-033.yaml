# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01). A buy stop at 5005.00
# (order 1) and a sell stop at 4995.00 (order 2), placed at one instant, form one OCO group:
# the bar from 14:30 to 14:31 reaches both, high 5006.00 and low 4994.00, each 6.00 from the open;
# flat after the open, the first extreme is the favourable one for the earliest placed entry, the
# lower order id at one instant (F-BAR-03): order 1, so the high comes first;
# on the way up the path passes 5005.00 (F-STP-01): fill = 5005.00 + 1 × 0.25 = 5005.25 (F-STP-04),
# and order 2 is cancelled (F-OCO-01);
# with the low first, order 2 would have filled at 4995.00 - 0.25 = 4994.75 instead, so the fill
# is flagged ambiguous (F-BAR-05).
