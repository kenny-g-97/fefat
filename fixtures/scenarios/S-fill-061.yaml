# Arithmetic (ES, tick 0.25; limits fill when a trade goes through them: F-LMT-01):
# the buy limit at 4995.00, active at 14:30:00.100, sees 5000.00 and rests (F-LMT-04);
# at the roll, 22:00:00 on 03-08, the front becomes ESM2026 (F-ROL-01) and the resting limit moves
# by the gap, to 4995.00 + 20.00 = 5015.00 (F-ROL-03); the run is flat, so no leg is sent;
# the trade at 5016.00 does not go through it; the trade at 5014.75, below 5015.00, does
# (F-LMT-01): fill = the limit = 5015.00 (F-LMT-03), a maker, on ESM2026. Left at 4995.00, the
# limit would not fill on these trades.
