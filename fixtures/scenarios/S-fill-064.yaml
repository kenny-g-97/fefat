# Arithmetic (BTCUSDT-PERP: tick 0.10, point value 1, quantities in BTC on a lot step of 0.001;
# daily bars are the UTC days; one tick of slippage on bars: F-SLP-01):
# the long of 0.010 BTC held when the tape starts is marked at the close of the bar of 03-06,
# 65231.7 (F-MRK-01); the sell decided at that close, 00:00 on 03-07, is active at 00:00:00.100
# and sees the bar of 03-07 (F-ACT-02), whose fills happen at its close, 00:00 on 03-08
# (F-BAR-06);
# the funding times of 08:00 and 16:00 fall inside that bar, so they see the long as it stood
# before it, at the mark the bar of 03-06 left (F-FND-01): at 08:00 the long pays
# 0.010 x 65231.7 x 1 x 0.0001 = 0.0652317, a cash change of -0.0652317 rounded toward minus
# infinity to -0.065232 (F-FEE-03); at 16:00 0.010 x 65231.7 x 0.0003 = 0.1956951, rounded to
# -0.195696;
# at 00:00 on 03-08 the bar of 03-07 closes first (F-CLK-02): the sell fills at its open less a
# tick, 65230.0 - 0.1 = 65229.9 (F-MKT-03), and the funding of that instant finds the run flat,
# so it pays nothing.
