# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01):
# order 1 buys 1 lot on the trade at 14:30:00.200, at 5000.00 + 0.25 = 5000.25 (F-MKT-02); its
# stop, order 2, 8 ticks below the fill at 4998.25, above the trailing level 5000.00 - 2.00 =
# 4998.00 (F-PLN-04); its target, order 3, at 5010.25 (F-PLN-01);
# breakeven fires 2 ticks above the fill, at 5000.25 + 0.50 = 5000.75 (F-BRK-02), and holds the
# stop at the fill plus 4 ticks, 5000.25 + 1.00 = 5001.25 (F-BRK-01);
# 14:30:10, 5000.75: breakeven fires, and its level 5001.25 lies above this trade, so the stop
# rises only to a tick below it, 5000.50 (F-PLN-03); the trailing level is 5000.75 - 2.00 =
# 4998.75;
# 14:30:20, 5001.50: the highest of the stop's 5000.50, breakeven's 5001.25, and the trailing
# level 5001.50 - 2.00 = 4999.50 is 5001.25, a tick below this trade: the stop rises to 5001.25
# (F-BRK-01, F-TRL-01);
# 14:30:30, 5001.00: the trade is below the stop and triggers it (F-STP-01): it sells at the lower
# of 5001.25 - 0.25 = 5001.00 and 5001.00, 5001.00 (F-STP-03), and the target is cancelled
# (F-OCO-01).
# A bar whose high, 5001.50 or above, fires breakeven puts the stop at 5001.25 at once; a
# breakeven that moved the stop only at its firing would leave it at 5000.50 on these trades, and
# nothing would sell.
