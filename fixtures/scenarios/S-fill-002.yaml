id: S-fill-002
title: A sell market order on TBBO fills whole at the bid, flagged when larger than the bid's size
fidelity: tbbo
instrument: ES
orders:
  - {id: 1, placed_at: "2026-03-06T14:30:00.000Z", side: sell, kind: market, quantity: 5}
tape:
  - {ts: "2026-03-06T14:30:00.150Z", price: "4999.75", size: 1, bid: "4999.75", ask: "5000.00", bid_size: 3, ask_size: 9}
  - {ts: "2026-03-06T14:30:00.400Z", price: "4999.50", size: 2, bid: "4999.50", ask: "4999.75", bid_size: 7, ask_size: 4}
expected:
