rules: [F-ACT-01, F-MKT-01, F-QTY-01, F-SLP-01]

# Arithmetic (ES, tick 0.25; TBBO fills at the quote, with no slippage ticks: F-SLP-01):
# active at 14:30:00.000 + 100 ms = 14:30:00.100 (F-ACT-01);
# the first record at or after it, at 14:30:00.150, shows the bid at 4999.75 for 3 contracts;
# fill = bid - 0 ticks = 4999.75 - 0 × 0.25 = 4999.75 (F-MKT-01), all 5 contracts at once;
# 5 contracts > the 3 shown at the bid, so the fill is flagged size_exceeded (F-QTY-01).
