# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01):
# order 1 buys 1 lot on the trade at 14:30:00.200, at 5000.00 + 0.25 = 5000.25 (F-MKT-02);
# the trailing distance is 1.0 × the entry row's atr, 2000000000.0 in 1e-9 units of price, 2.00
# points, 8 ticks (F-TRL-02, F-RND-01): the stop 12 ticks below the fill, 4997.25, rises at once to
# 5000.00 - 2.00 = 4998.00 (F-PLN-04, F-TRL-01): order 2; the target, order 3, at 5010.25;
# 14:30:20, 5003.00: a new best price; the stop rises to 5001.00;
# 14:30:40, 5001.50: above the stop, and no new best price;
# at the 14:31 decision the row's atr is 250000000.0: the distance becomes 0.25 point, 1 tick
# (F-TRL-02), and the trailing level 5003.00 - 0.25 = 5002.75 lies above the mark 5001.50, so the
# stop rises only to a tick below the mark, 5001.25 (F-PLN-03);
# 14:31:20, 5002.50: no new best price, but the trailing level 5002.75 now lies above the stop, and
# the stop rises to a tick below this trade, 5002.25 (F-PLN-03, F-TRL-04);
# 14:31:40, 5002.25: the trade is at the stop and triggers it (F-STP-01): it sells at the lower of
# 5002.00 and 5002.25, 5002.00 (F-STP-03), and the target is cancelled (F-OCO-01).
# A replay that skips by the 1-minute bar from 14:31 to 14:32, which trades from 5002.25 to
# 5002.50, finds the stop at 5001.25 below it, the target above it, and the bar under the plan's
# best price, 5003.00, but the stop stands below its trailing level, held there by the market, so
# a price under the best can still raise it: it must descend to the trades (F-PLN-05); skipped,
# the stop would stay at 5001.25, and nothing would sell.
