# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01):
# the bar from 14:30:00 to 14:30:01 reaches 5004.75 at most, below the stop;
# the bar from 14:30:01 to 14:30:02 opens at 5004.75 and reaches 5005.25: on its path from the open
# to the high the price passes 5005.00 (F-BAR-01), which triggers the stop (F-STP-01);
# fill = 5005.00 + 1 × 0.25 = 5005.25 (F-STP-04), at the bar's close, 14:30:02 (F-BAR-06).
