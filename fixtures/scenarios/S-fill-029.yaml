# Arithmetic (BTCUSDT-PERP: tick 0.10, point value 1, quantities in BTC on a lot step of 0.001;
# maker 2 bps, taker 5 bps; one tick of slippage on trades: F-SLP-01):
# the sell limit for 0.013 BTC at 65000.0 first sees 64990.0 and rests; 65000.0 only touches it;
# 65000.4 prints above it (F-LMT-01): fill = the limit = 65000.0 (F-LMT-03), a maker, since it
# filled after the first price it saw (F-LMT-04);
# maker fee = 65000.0 × 0.013 × 1 × 0.0002 = 845.0 × 0.0002 = 0.169 (F-FEE-02);
# funding at 08:00:00.000 comes before the trade of that instant (F-CLK-02), at the mark of the last
# trade before it, 65123.7 (F-MRK-01): value = 65123.7 × 0.013 × 1 = 846.6081, and
# 846.6081 × 0.0001 = 0.08466081, received by the short since the rate is positive (F-FND-01),
# rounded down as a credit to 0.084660 (F-FEE-03);
# the buy market order, active at 09:00:00.100, fills at the first trade plus a tick:
# 65200.0 + 0.1 = 65200.1 (F-MKT-02);
# taker fee = 65200.1 × 0.013 × 1 × 0.0005 = 847.6013 × 0.0005 = 0.42380065, rounded up as a charge
# to 0.423801 (F-FEE-03).
