# Arithmetic (ES, tick 0.25). A long of 1 has its stop at 4995.00 and its target at 5010.00, one
# OCO group:
# the bar from 14:30 to 14:31 opens at 5012.00, a jump past the target (F-BAR-01), so the market
# traded through it at the open (F-LMT-01);
# fill = the limit = 5010.00 (F-LMT-03), at the open's pseudo-tick, before either extreme; the stop
# is cancelled (F-OCO-01), so the low of 4994.00 later fills nothing: the stop wins only when both
# are reached after the open (F-BAR-02);
# with the extremes the other way round the target still fills at the open, so the bar is not
# ambiguous (F-BAR-05) and the fill = the limit = 5010.00 carries no flag.
