  - {id: 2, placed_at: "2026-03-06T14:30:00.000Z", side: sell, kind: limit, price: "5010.00", quantity: 1, oco: exit}
tape:
  - {ts_open: "2026-03-06T14:30:00Z", ts_close: "2026-03-06T14:31:00Z", open: "5012.00", high: "5013.00", low: "4994.00", close: "5000.00", volume: 900}
