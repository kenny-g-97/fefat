# Arithmetic (ES, tick 0.25; TBBO fills at the quote, with no slippage ticks, and a quote is read
# no better than its record's trade: F-SLP-01). A long of 1 has its stop at 4995.50, active at
# 14:30:00.100:
# the record at 14:30:00.200 trades 4996.00, above the stop;
# at 14:30:00.300 a seller sweeps the bids: the first print takes the 6 lots bid at 4995.75, at the
# bid, still above the stop; the next prints, at 4995.25 and 4994.00, carry the quote from before
# the sweep, a bid of 4995.75 that the first print took;
# the print at 4995.25 is at or below the stop and triggers it (F-STP-01); on TBBO a triggered stop
# fills at the next tradeable record (F-STP-02), the print at 4994.00, whose bid of 4995.75 lies
# above its trade, so the bid counts as that trade, 4994.00, and its 5 lots (F-SLP-01):
# fill = lower of (4995.50 - 0 × 0.25, 4994.00) = 4994.00 (F-STP-02), 6 ticks below the stop;
# read as recorded, the bid would fill it at the lower of (4995.50, 4995.75) = 4995.50, above every
# later print of its sweep; on trades the same prints fill it at the trigger print, the lower of
# (4995.50 - 0.25, 4995.25) = 4995.25 (F-STP-03).
