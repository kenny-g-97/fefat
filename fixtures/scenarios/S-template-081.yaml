id: S-template-081
title: An exit still waiting for its activation at a roll does not do the close leg's work, and fills after the legs on the new front
fidelity: trades
instrument: {tick_size: "0.25", point_value: "50", lot_step: "1"}
rolls:
  - {trade_date: "2026-03-06", session_open: "2026-03-06T14:31:00.050Z", rolled_from: DRAWN-H, contract: DRAWN-M, gap: "20.00", reason: volume}
strategy:
  spec_version: 1
  instrument: ES
  timeframe: 1m
  execution:
    entry: {kind: market}
    sizing: {kind: fixed, units: 1}
    signal_exit: true
signals:
  - {ts_close: "2026-03-06T14:30:00Z", trade_date: "2026-03-06", contract: DRAWN-H, long_entry: true}
  - {ts_close: "2026-03-06T14:31:00Z", trade_date: "2026-03-06", contract: DRAWN-H, long_exit: true}
tape:
  - {ts: "2026-03-06T14:30:00.200Z", price: "5000.00", size: 3}
