id: S-fill-036
title: When one TBBO record would fill both a long's triggered stop and its target, the stop fills
fidelity: tbbo
instrument: ES
position: {side: long, quantity: 1, price: "5000.00"}
orders:
  - {id: 1, placed_at: "2026-03-06T14:30:00.000Z", side: sell, kind: stop, price: "4995.00", quantity: 1, oco: exit}
  - {id: 2, placed_at: "2026-03-06T14:30:00.000Z", side: sell, kind: limit, price: "5005.00", quantity: 1, oco: exit}
tape:
  - {ts: "2026-03-06T14:30:00.200Z", price: "4995.00", size: 2, bid: "4995.00", ask: "4995.25", bid_size: 6, ask_size: 4}
  - {ts: "2026-03-06T14:30:00.300Z", price: "5005.25", size: 1, bid: "5005.00", ask: "5005.25", bid_size: 3, ask_size: 5}
expected:
  fills:
    - {order: 1, ts: "2026-03-06T14:30:00.300Z", price: "4995.00", rule: F-STP-02}
rules: [F-LMT-01, F-OCO-01, F-SLP-01, F-STP-01, F-STP-02]

# Arithmetic (ES, tick 0.25; TBBO fills at the quote, with no slippage ticks: F-SLP-01). A long of
# 1 has its stop at 4995.00 and its target at 5005.00, one OCO group:
# the trade at 4995.00 at 14:30:00.200 is at the stop and triggers it (F-STP-01);
# the next record, at 14:30:00.300, fills it: lower of (4995.00 - 0 × 0.25, bid 5005.00) = 4995.00
# (F-STP-02), never above the stop;
# that record also trades at 5005.25, through the target (F-LMT-01), which would fill at 5005.00;
# one record cannot fill both, and the stop fills (F-OCO-01): it was a market order since the
# record before; the target is cancelled.
