# Arithmetic (ES, tick 0.25; limits fill through their price, at it: F-LMT-01, F-LMT-03):
# at 14:30 long_entry places a buy limit at 4999.00, order 1 (F-ENT-02), live for two decisions;
# at 14:31 order 1 is still live, so the template, which enters only flat with nothing live,
# places nothing (F-ENT-01);
# at 14:32, the second decision after the one that placed it, order 1 is still live and is
# cancelled there, first thing (F-ENT-03); the trade at 14:32:00.500, 4998.50, would have filled it;
# at 14:33 the template is flat with nothing live, so long_entry places a buy limit at 4998.00,
# order 2, which the trade at 14:33:00.500, 4997.75, goes through: it fills at 4998.00 (F-LMT-03),
# its stop and target orders 3 and 4.
