# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01):
# the bar from 14:30 to 14:31 closes at 5000.00, the market when the decision at its close places a
# buy stop at 4998.00 (F-MRK-01): the stop is below the market, through it, and fills at once as a
# market order (F-STP-05);
# active at 14:31:00.100, it sees the bar from 14:31 to 14:32 (F-ACT-02), which opens at 4996.00,
# back below the stop: the stop was judged once, when it became active, so it still fills as a
# market order at that open: fill = 4996.00 + 1 × 0.25 = 4996.25 (F-MKT-03, F-STP-05), at 14:32:00;
# judged again at that open, it would have worked from there, and the path, going to the high first
# for a flat buy entry, would have reached it: fill = 4998.00 + 0.25 = 4998.25, by F-STP-04.
