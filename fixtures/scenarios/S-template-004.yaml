id: S-template-004
title: A template places nothing on a bar whose wake is false and closes its long on long_exit
fidelity: 1m
instrument: ES
strategy:
  spec_version: 1
  instrument: ES
  timeframe: 5m
  execution:
    entry: {kind: market}
    stop: {kind: ticks, ticks: 12}
    targets: [{price: {kind: ticks, ticks: 24}}]
    sizing: {kind: fixed, units: 1}
signals:
  - {ts_close: "2026-03-06T14:30:00Z", trade_date: "2026-03-06", contract: ESH2026, long_entry: true, wake: false}
  - {ts_close: "2026-03-06T14:35:00Z", trade_date: "2026-03-06", contract: ESH2026, long_entry: true}
  - {ts_close: "2026-03-06T14:40:00Z", trade_date: "2026-03-06", contract: ESH2026, long_exit: true}
tape:
  - {ts_open: "2026-03-06T14:30:00Z", ts_close: "2026-03-06T14:31:00Z", open: "4999.00", high: "4999.50", low: "4998.75", close: "4999.25", volume: 50}
  - {ts_open: "2026-03-06T14:35:00Z", ts_close: "2026-03-06T14:36:00Z", open: "5000.00", high: "5001.00", low: "4999.75", close: "5000.75", volume: 90}
  - {ts_open: "2026-03-06T14:40:00Z", ts_close: "2026-03-06T14:41:00Z", open: "5002.00", high: "5002.75", low: "5001.50", close: "5002.50", volume: 70}
expected:
  fills:
    - {order: 1, ts: "2026-03-06T14:36:00Z", price: "5000.25", rule: F-MKT-03}
    - {order: 4, ts: "2026-03-06T14:41:00Z", price: "5001.75", rule: F-MKT-03}
rules: [F-ACT-02, F-MKT-03, F-OCO-02, F-SLP-01]

# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01):
# at the 14:30 close long_entry is true but wake is false, so no entry is placed: a buy there
# would have filled at the open of the bar from 14:30 to 14:31, 4999.00 + 0.25 = 4999.25;
# at the 14:35 close long_entry is true and the bar wakes: order 1 buys 1 lot and fills at the
# open of the bar from 14:35 to 14:36 plus a tick, 5000.00 + 0.25 = 5000.25 (F-ACT-02, F-MKT-03);
# its bracket, orders 2 and 3, is placed at 5000.25 - 3.00 = 4997.25 and 5000.25 + 6.00 = 5006.25
# (F-OCO-02), and the rest of that bar, 4999.75 to 5001.00, reaches neither;
# at the 14:40 close long_exit is true while long, and signal exits are on: the template cancels
# orders 2 and 3 and sells the lot at the market, order 4, which fills at the open of the bar from
# 14:40 to 14:41 less a tick, 5002.00 - 0.25 = 5001.75 (F-MKT-03): a gain of 1.50 points.
