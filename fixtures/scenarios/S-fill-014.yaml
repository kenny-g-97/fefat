id: S-fill-014
title: A buy stop placed below the market is accepted, triggers on the first record, and fills no lower than its price
fidelity: tbbo
instrument: ES
orders:
  - {id: 1, placed_at: "2026-03-06T14:30:00.000Z", side: buy, kind: stop, price: "5000.00", quantity: 1}
tape:
  - {ts: "2026-03-06T14:29:59.950Z", price: "5001.00", size: 2, bid: "5000.75", ask: "5001.00", bid_size: 9, ask_size: 7}
  - {ts: "2026-03-06T14:30:00.200Z", price: "5001.00", size: 1, bid: "5000.75", ask: "5001.00", bid_size: 8, ask_size: 5}
  - {ts: "2026-03-06T14:30:00.350Z", price: "4999.75", size: 4, bid: "4999.50", ask: "4999.75", bid_size: 6, ask_size: 3}
expected:
  fills:
    - {order: 1, ts: "2026-03-06T14:30:00.350Z", price: "5000.00", rule: F-STP-02}
rules: [F-SLP-01, F-STP-01, F-STP-02, F-STP-05]

# Arithmetic (ES, tick 0.25; TBBO fills at the quote, with no slippage ticks: F-SLP-01):
# the last trade before the stop becomes active, 5001.00, is above it; CME would refuse a buy stop
# at or below the last trade, and the engine accepts it (F-STP-05);
# the first record after the activation trades at 5001.00, at or above 5000.00: it triggers (F-STP-01);
# the next record's ask is 4999.75;
# fill = higher of (5000.00 + 0 × 0.25, 4999.75) = 5000.00 (F-STP-02): never below the stop.
