# the stop moves to the fill price less 2 ticks, 5000.25 - 0.50 = 4999.75, below the market
# (F-BRK-01, F-PLN-03);
# the trade at 14:30:02, 5000.25, stays above it;
# the trade at 14:30:03, 4999.75, triggers it (F-STP-01): it sells at the lower of 4999.50 and
# 4999.75, 4999.50 (F-STP-03), and the target is cancelled (F-OCO-01).
