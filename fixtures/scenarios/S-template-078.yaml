  - {ts_close: "2026-03-07T07:59:00Z", trade_date: "2026-03-07", contract: BTCUSDT-PERP, long_entry: true}
  - {ts_close: "2026-03-07T08:01:00Z", trade_date: "2026-03-07", contract: BTCUSDT-PERP, long_exit: true}
