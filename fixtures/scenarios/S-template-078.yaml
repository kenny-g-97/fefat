# Arithmetic (BTCUSDT-PERP: tick 0.10, point value 1, quantities in BTC on a lot step of 0.001; no
# slippage ticks, set for the scenario: F-SLP-01; latency 100 ms):
# at 07:59 long_entry buys 0.010 BTC, order 1, filled at 65000.0 (F-MKT-02) and marked there
# (F-MRK-01);
# at the funding time of 08:00 the long pays 0.010 x 65000.0 x 1 x 0.001 = 0.65, a cash change of
# -0.65 (F-FND-01), which counts in the open trade's profit and loss (§20);
# at 08:01 long_exit closes the long, order 2 (F-ENT-04), filled at 65000.0: the trade's fills
# moved the cash by 0.00, and with the funding it lost 0.65;
# at 08:02 the day's closed trades lost 0.65, at or below minus daily_loss_stop = -0.5
# (F-LIM-02): no entry. With funding left out of the trade the loss would be 0.00, and the
# template would buy at 08:02.
