# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01):
# order 1 buys 1 lot on the trade at 14:30:00.200, at 5000.00 + 0.25 = 5000.25 (F-MKT-02); its stop,
# order 2, at 5000.25 - 2.00 = 4998.25, and its target, order 3, at 5010.25; a trailing stop by the
# column moves at decisions alone (F-TRL-04), so the fill does not move it;
# 14:33, 5002.00: no move between decisions;
# at the 14:35 decision the row's trail_ref is 5001.00: the stop rises to it, below the mark 5002.00
# less a tick (F-TRL-02, F-PLN-03);
# 14:37, 5001.25: above the stop;
# at the 14:40 decision the row's trail_ref, 4999.00, would lower the stop, which stays (F-PLN-03);
# 14:41, 5001.00: at the stop, which sells at the lower of 5000.75 and 5001.00, 5000.75 (F-STP-03),
# and the target is cancelled (F-OCO-01).
