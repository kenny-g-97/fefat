# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01). A short mirrors the long of
# S-template-023:
# order 1 sells 1 lot on the trade at 14:30:00.200, at 5000.00 - 0.25 = 4999.75 (F-MKT-02);
# its plan: the stop 8 ticks above the fill, 4999.75 + 2.00 = 5001.75, which the trailing stop,
# working from the fill, lowers at once to the market at the fill plus 4 ticks, 5000.00 + 1.00 =
# 5001.00 (F-PLN-04, F-TRL-01): order 2, a buy stop at 5001.00; the target, order 3, a buy limit at
# 4999.75 - 10.00 = 4989.75;
# each new low is the short's best price, and the stop falls to 4 ticks above it (F-TRL-04,
# F-PLN-03):
# 14:30:01, 4999.50: the stop falls to 5000.50;
# 14:30:02, 4998.75: to 4999.75;
# 14:30:03, 4999.25: no new low, and it stays below the stop;
# 14:30:04, 4998.00: to 4999.00;
# 14:30:05, 4999.00: the trade is at the stop and triggers it (F-STP-01): it buys at the higher of
# 4999.00 + 0.25 and 4999.00, 4999.25 (F-STP-03), and the target is cancelled (F-OCO-01).
