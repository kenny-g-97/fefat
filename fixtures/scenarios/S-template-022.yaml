# Arithmetic (ES, tick 0.25; one tick of slippage on bars: F-SLP-01):
# order 1 buys 1 lot at 5000.00 + 0.25 = 5000.25 (F-MKT-03), at 14:31; its stop, order 2, at
# 5000.25 - 2.00 = 4998.25, its target, order 3, at 5010.25; breakeven waits for 5000.25 + 1.00 =
# 5001.25 (F-BRK-02) and then puts the stop a tick over the fill price, 5000.50;
# the rest of the entry's bar marks 4999.75 and 5000.75 (F-PLN-04), short of 5001.25;
# the bar from 14:31 to 14:32 replays for the long as 5000.50, 5000.25, 5001.50, 5000.25 (F-BAR-02):
# the low stays over the stop at 4998.25; the high, 5001.50, is marked once the path reaches it and
# fires breakeven: the stop moves to 5000.50, below 5001.50 - 0.25 (F-BRK-01, F-PLN-03), and works on
# the rest of the path; the fall from 5001.50 to the close, 5000.25, passes 5000.50 (F-BAR-01), where
# the stop sells at 5000.50 - 0.25 = 5000.25 (F-STP-04), and the target is cancelled (F-OCO-01);
# with its extremes swapped the high comes first and moves the stop, and the fall to the low passes
# it at the same price: the bar fills the same and is not ambiguous.
