# Arithmetic (ES, tick 0.25; one tick of slippage on trades: F-SLP-01; a fee of 2.50 per contract
# per side):
# the buy market order for 2 contracts fills at the first trade plus a tick:
# 5000.00 + 0.25 = 5000.25 (F-MKT-02);
# its bracket is placed then and works from the next trade on (F-OCO-02): stop 4990.00, target 5010.00;
# the trade at 5010.25 goes through the target (F-LMT-01): fill = the limit = 5010.00 (F-LMT-03),
# and the stop is cancelled (F-OCO-01);
# fee of each fill = 2 contracts × 2.50 = 5.00 (F-FEE-01), so the round trip pays 10.00.
