# Arithmetic (BTCUSDT-PERP, tick 0.1, lots of 0.001 BTC at 1 USD a point a BTC; one tick of
# slippage on trades: F-SLP-01; latency 100 ms):
# the trade at 08:59:59.000 marks the market at 60,000.0 (F-MRK-01); a lot of 0.001 BTC is
# worth 60.00 USD there, so 1,000 USD buys floor(1,000 / 60) = floor(16.67) = 16 whole lots
# (F-SIZ-02), and the row's size_mult of 2 makes 2 × 16 = 32 lots, 0.032 BTC (F-SIZ-04); rounding
