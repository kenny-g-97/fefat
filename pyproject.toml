[project]
name = "fefat-workspace"
version = "0.0.0"
description = "FEFAT monorepo root: the uv workspace and the shared development tools"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/fefat", "python/fefat_app"]
# The cross-check against NautilusTrader (step 2.14) is a uv project of its own, outside the
# workspace: `uv run --project python/tests/external …`.
exclude = ["python/tests/external"]

[tool.uv.sources]
fefat = { workspace = true }
fefat-app = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "hypothesis>=6.168.5",
    "import-linter",
    "ipykernel>=7.4.0",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "maturin>=1.15.0",
    "nbstripout",
    "pyarrow==26.0.0",
    "pyright",
    "pytest",
    "ruff",
    "ta-lib>=0.8.3",
    "tzdata",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "python/fefat/src",
    "python/fefat_app/src",
    "python/tests",
    "python/tests/features/leaks",
    "python/tests/external/src",
    "scripts",
]
# .agents and .codex hold other tools' files, untracked in a clone, which are not FEFAT's.
extend-exclude = [".claude", ".agents", ".codex"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "N", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pyright]
include = ["python", "scripts"]
extraPaths = ["scripts", "docs/masterplan/tools", "engine/crates/fefat-py"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", "python/tests/external"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["python/fefat_app"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "--ignore=python/tests/external"
pythonpath = ["scripts", "docs/masterplan/tools"]

[tool.importlinter]
root_packages = ["fefat", "fefat_app"]

[[tool.importlinter.contracts]]
name = "The SDK never imports the app"
type = "forbidden"
source_modules = ["fefat"]
forbidden_modules = ["fefat_app"]

[[tool.importlinter.contracts]]
name = "The analytics never import the strategies or the backtests, which import their labels"
type = "forbidden"
source_modules = ["fefat.analytics"]
forbidden_modules = ["fefat.strategy", "fefat.backtest"]
