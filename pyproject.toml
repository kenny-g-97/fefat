[project]
name = "fefat-workspace"
version = "0.0.0"
description = "FEFAT monorepo root: the uv workspace and the shared development tools"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/fefat", "python/fefat_app"]

[tool.uv.sources]
fefat = { workspace = true }
fefat-app = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "import-linter",
    "ipykernel>=7.4.0",
    "maturin>=1.15.0",
    "nbstripout",
    "pyarrow==26.0.0",
    "pyright",
    "pytest",
    "ruff",
    "tzdata",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python/fefat/src", "python/fefat_app/src", "python/tests", "scripts"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "N", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pyright]
include = ["python", "scripts"]
extraPaths = ["scripts", "docs/masterplan/tools", "engine/crates/fefat-py"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["python/fefat_app"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["scripts"]

[tool.importlinter]
root_packages = ["fefat", "fefat_app"]

[[tool.importlinter.contracts]]
name = "The SDK never imports the app"
type = "forbidden"
source_modules = ["fefat"]
forbidden_modules = ["fefat_app"]
