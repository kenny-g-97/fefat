[project]
name = "fefat-app"
version = "0.0.1"
description = "FEFAT local server: HTTP, application services, database, jobs, executor, agent, push"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1,<2",
    "fefat",
    "keyring>=25.7.0,<26",
    "sqlalchemy>=2.1.8,<3",
]

[project.scripts]
fefat = "fefat_app.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
