[project]
name = "fefat-xcheck"
version = "0.0.0"
description = "FEFAT's cross-check against NautilusTrader and NinjaTrader 8 (step 2.14): a test-only environment outside the uv workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nautilus_trader==1.231.0",
    "polars==2.0.0",
]

[dependency-groups]
dev = [
    "databento-dbn==0.72.0",
    "pyright",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
