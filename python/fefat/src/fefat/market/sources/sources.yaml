# and printed by fefat data sources. Written from docs/masterplan/appendix/research-data-sources.md
# as read on researched_on; no source has confirmed desktop use in writing yet (ADR-0018).
researched_on: 2026-10-12
sources:
  - id: databento
    name: "Databento"
    kind: vendor
    offers: "Every CME, CBOT, NYMEX, and COMEX futures and options contract since 2010-06-06: trades, top-of-book, depth, and full order book ticks with nanosecond timestamps, OHLCV bars at 1 second, 1 minute, 1 hour, and 1 day, instrument definitions, and statistics with settlement prices and open interest. Continuous symbols such as ES.c.0, ES.n.0, and ES.v.0 follow the front contract by expiry, open interest, or volume, with unadjusted prices."
    cost: "Standard plan $199 a month since 2026-06-22, up from $179, with live data, 1 year of L1 history, 1 month of L2 and L3, and 16+ years of bars, definitions, and statistics; Plus $1,750 and Unlimited $4,500 a month on annual contracts; or usage-based per GB at a rate the pricing page does not print, with $125 of free credit for new accounts."
    terms: "The User Agreement, effective 2024-01-31, licenses the data for internal business purposes only, requires keeping your credentials confidential, and forbids redistribution without exchange or Databento approval (§1.1, §1.3, §1.5(e)). Live CME data on the Standard plan is for personal use on two or fewer devices with a funded futures account, under the Exchange Data Policy of 2025-04-08."
    terms_page: "https://databento.com/legal/databento-user-agreement"
    desktop_use: check-the-terms
    desktop_use_note: "By inference, a desktop app using your own key or files on your machine is internal use, since no clause forbids third-party software for historical data and §1.3 only bars sharing credentials with other people, while live CME data may only run in software that routes orders through your broker (Exchange Data Policy Q6)."
    licence_scope: "Internal use by the account holder; no redistribution (user agreement §1.1, §1.5(e))"
    presets:
      - id: databento
        name: "Databento DBN batch download"
        reads: "Binary DBN files of a batch download with their metadata.json, manifest.json, and condition.json, or a single .dbn or .dbn.zst file, through fefat data import databento, with nanosecond UTC timestamps and bars stamped at the open by ts_event."
        status: available
      - id: databento-csv
        name: "Databento CSV export"
        reads: "CSV with one header line and the index timestamp first, prices as integers in 1e-9 units or as decimals, and timestamps as integer nanoseconds or ISO 8601 strings, all in UTC, with bars stamped at the open by ts_event; it arrives with fefat data import file in step 1.10."
        status: planned
