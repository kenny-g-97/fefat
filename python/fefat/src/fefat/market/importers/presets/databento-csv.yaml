# Databento CSV, from a batch download with encoding csv or from DBNStore.to_csv, of the schema
# ohlcv-1m: one header line, `ts_event,rtype,publisher_id,instrument_id,open,high,low,close,
# volume,symbol` (the symbol column when symbols are mapped, the default for CSV), timestamps as
# ISO 8601 (pretty_ts) or integer nanoseconds, prices with nine decimals (pretty_px) or as
# integers in 1e-9 units, all in UTC, and each bar stamped at its open by ts_event.
# Source: docs/masterplan/appendix/research-data-sources.md, Part D, Databento (CSV export).
kind: market_data
name: databento-csv
provider: databento-csv
description: "Databento CSV of 1-minute bars: ts_event at the open, UTC, pretty or raw values"
layout:
  delimiter: ","
  header: true
columns:
  timestamp: ts_event
  bars: {open: open, high: high, low: low, close: close, volume: volume}
  instrument_id: instrument_id
  symbol: symbol
timestamp:
  format: databento
  time_zone: UTC
  stamp: open
price:
  unit: databento
timeframe: 1m
